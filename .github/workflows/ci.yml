name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Run verify_transcription.py against the real weights (~4 GB download, tens of minutes)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keyed on the pull request *number*, not github.head_ref: head_ref is only a
  # branch name, so two pull requests opened from different forks that both use
  # `patch-1` would share a group and cancel each other. github.event_name keeps
  # a manually dispatched run out of the push group entirely -- a queued run is
  # replaced when a newer one joins its group, and silently discarding a 4 GB
  # integration run somebody asked for by hand is not recoverable by re-pushing.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Not cosmetic: an unset shell runs `bash -e`, while an explicit `bash` runs
    # `bash --noprofile --norc -eo pipefail`. Without pipefail a failing command
    # on the left of a pipe is masked by whatever it is piped into.
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Read the version from pyproject.toml rather than repeating the literal,
      # the same way .claude/hooks/lib.sh does. b06c493 removed this literal from
      # all four hooks because a checker that disagrees with required-version is
      # worse than no checker: bumping the pin would leave CI invoking a ruff
      # that refuses to run, so the job reports failure while linting nothing.
      #
      # Unlike ruff_pin() this does not fall back to a bare `ruff`. The hook
      # falls back so a malformed pyproject cannot block an edit; here it is the
      # defect itself, and a bare `ruff` would abort on required-version anyway.
      - name: Resolve the pinned ruff
        id: pin
        run: |
          pin=$(sed -n 's/^required-version *= *"==\([0-9][0-9.]*\)".*/\1/p' pyproject.toml | head -1)
          if [ -z "${pin}" ]; then
            echo "::error::could not read required-version from [tool.ruff] in pyproject.toml"
            exit 1
          fi
          echo "RUFF=ruff@${pin}" >> "${GITHUB_ENV}"
          echo "pinned ruff is ${pin}"

      # Every check runs even when an earlier one failed. Steps abort the job by
      # default, which is the same short-circuit the deleted Stop hook was
      # rewritten to remove before it went: chaining `format --check && check`
      # there meant a whitespace slip stopped `ruff check` from ever running, and
      # an undefined name rode out behind it. One push should surface every
      # failure it has, not the first one alphabetically.
      #
      # This is now the only repo-wide ruff anywhere -- .claude/hooks/edit-checks.sh
      # sees just the file it was handed -- so a failure here is not a duplicate
      # of something a hook already said.
      - name: ruff check
        if: ${{ !cancelled() && steps.pin.outcome == 'success' }}
        run: uvx "${RUFF}" check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() && steps.pin.outcome == 'success' }}
        run: uvx "${RUFF}" format --check --output-format=github .

      # The hooks are what no checker sees. .claude/hooks/edit-checks.sh filters
      # on *.py, so a .sh file Claude edits is checked by nothing in-session, and
      # both ways a hook breaks are silent. The glob is `.claude/hooks/*.sh` and
      # not something wider because the only other shell here lives inside `run:`
      # blocks, which shellcheck cannot be pointed at without lifting them into
      # files -- the `release` job's is the one long enough for that to be a real
      # question, and it carries `set -u` in lieu of an answer.
      #
      # A syntax error makes guard.sh return rc=2 on every payload, and since its
      # PreToolUse matcher is Bash|Edit|Write|Read it then blocks the Edit that
      # would repair it. A `set -u` typo is worse: `bash -n` passes clean, the
      # misspelled $RE_INSTAL raises "unbound variable", the hook exits 1 -- and
      # rc=1 is neither 0 nor 2, so the tool call proceeds and an out-of-lockfile
      # `pip install` sails through unguarded. Both measured. b06c493 is titled
      # "Fix the hooks the previous commit shipped broken", so this is not
      # hypothetical.
      #
      # shellcheck rather than `bash -n`, which catches only the first of those:
      # SC2153 names the misspelling ("RE_INSTAL may not be assigned. Did you
      # mean RE_INSTALL?") and SC2034 flags the original going unused. It returns
      # a verdict, which is this workflow's rule for admitting a step. -x follows
      # the lib.sh that edit-checks.sh sources.
      #
      # Blocking, and pinned for exactly the reason ruff is. This step first ran
      # the runner's own shellcheck, arguing that a roughly yearly release
      # cadence made a pin unnecessary -- but the line this workflow draws is
      # about whether a verdict is reproducible, not how often the tool moves.
      # ubuntu-24.04 ships 0.10.0 where the machine this was written on has
      # 0.11.0, so the two disagreed by environment before the step had run once,
      # and shellcheck does enable new checks by default in minor releases
      # (SC2317 in 0.9, SC2329 in 0.10) -- any of which would turn every open
      # pull request red on a hook nobody had touched. required-version holds
      # that line for ruff; shellcheck has no equivalent setting, so the pin
      # lives in the invocation. Bumping it is then a commit, which is the point.
      #
      # Findings land in the log rather than as annotations: shellcheck has no
      # GitHub output format, and a blocking step is read on failure anyway.
      - name: shellcheck the hooks
        if: ${{ !cancelled() }}
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck -x .claude/hooks/*.sh

  test:
    # ubuntu, and this is the one job here that can be. tests/test_pure.py never
    # imports mlx_audio -- utils/ keeps those imports inside the functions that
    # need them -- so nothing in this job needs Apple Silicon, ffmpeg, `say` or a
    # token, and Linux runners bill at a fraction of the macOS rate.
    #
    # It doubles as the check that `uv sync --locked` actually resolves on Linux,
    # which the `check` job below only asserts in a comment: mlx ships manylinux
    # wheels and mlx-metal is gated behind sys_platform == 'darwin', so a lockfile
    # change that breaks that arrangement turns this job red rather than being
    # discovered by a contributor.
    name: test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # --locked is the lockfile check, not merely an install flag: it asserts
      # uv.lock will remain unchanged, so a lockfile that has drifted from
      # pyproject.toml turns this job red. `lint` carried a separate
      # `uv lock --check` step for exactly that until it was cut -- the same
      # assertion on the same triggers, so it could never have failed alone.
      # It matters because uv.lock is the only thing pinning mlx-audio to the
      # 0.5.1 that _patch_vad_dtype targets; pyproject.toml asks only for
      # >=0.4.4, and a drifted lockfile is a real defect here rather than
      # bookkeeping.
      #
      # pytest arrives with it, from the `dev` dependency group.
      - name: uv sync
        run: uv sync --locked

      - name: pytest
        run: uv run --locked pytest

  check:
    # macOS on purpose: ty runs against the real dependency tree and the decode
    # matrix goes through miniaudio and ffmpeg, and Apple Silicon is the only
    # platform this app claims to run on.
    #
    # This comment used to add that a Linux-only resolution failure "would be red
    # for a reason that does not matter to the project". That is no longer the
    # position: the `test` job above deliberately syncs on Linux, because that is
    # what lets the pure tests run on a cheap runner. Resolving on Linux went
    # from an incidental property to one CI asserts. What stays true is that
    # nothing Linux can do substitutes for this job.
    #
    # macos-15 rather than macos-latest, which now points at macOS 26: the label
    # is pinned so an image promotion cannot change the MLX runtime under the
    # build.
    name: check (macOS)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # --locked, and never `uv pip install -e .`: the latter re-resolves from
      # pyproject.toml and ignores the committed lockfile entirely.
      - name: uv sync
        run: uv sync --locked

      # Advisory, exactly as .claude/hooks/edit-checks.sh treats it. ty is
      # pre-1.0 and ships near-daily, so a new diagnostic is expected rather
      # than a regression, and a ty release must not turn an unrelated pull
      # request red. ruff is the blocking checker because required-version makes
      # its verdict reproducible; ty has no equivalent setting to hold a pin.
      #
      # --output-format=github because continue-on-error means this step cannot
      # change the verdict by construction: without annotations its findings
      # landed in the log of a passing job, where nobody goes. Worth wiring up
      # rather than deleting, because it is the only whole-project type check
      # anywhere -- .claude/hooks/edit-checks.sh runs ty against one file at a
      # time, so a function renamed in utils/ and its now-broken caller in
      # streamlit_app.py meet for the first time in this step.
      - name: ty check (advisory)
        continue-on-error: true
        run: uvx ty check --output-format=github .

      # Not preinstalled on the macOS runner images, and not optional: only wav,
      # mp3 and flac decode through miniaudio, so six of the nine rows in
      # UPLOAD_TYPES reach ffmpeg -- and check_decoding also uses it to *encode*
      # the fixtures it then decodes.
      - name: Install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install ffmpeg

      # The half of verify_transcription.py that needs no checkpoint: it
      # synthesizes one source file and asserts every advertised upload format
      # decodes back to the same duration. Calls the project's own
      # check_decoding rather than reimplementing the matrix in YAML, so adding
      # a row to UPLOAD_TYPES is picked up here for free -- and so this cannot
      # drift from what the real test asserts.
      - name: Decode every advertised upload format
        run: |
          uv run --locked python - <<'PY'
          import pathlib
          import sys
          import tempfile

          from verify_transcription import check_decoding


          def annotate(message: str) -> str:
              """Escape a failure for a ::error:: workflow command.

              The runner percent-decodes %25, %0D and %0A out of the message, and
              check_decoding produces both: the drift check formats a literal `%`
              ("12% off"), and a surfaced ffmpeg stderr line arrives with
              newlines. Unescaped, the annotation stops at the first newline --
              and the annotation is the whole diagnosis of a red build.
              """
              return message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          with tempfile.TemporaryDirectory(prefix="cohere-ci-") as tmp:
              failures = check_decoding(pathlib.Path(tmp))

          for failure in failures:
              print(f"::error::{annotate(str(failure))}")
          sys.exit(1 if failures else 0)
          PY

  integration:
    # Manual only, and it could not be otherwise: the checkpoint is gated, and
    # repository secrets are not exposed to pull requests from forks, so this
    # can never pass as a required check on an outside contribution. It also
    # downloads ~4 GB and runs a 2B-parameter model end to end.
    #
    # Gated on lint and test because the asymmetry is stark: both return a
    # verdict in under a minute, and there is no sense spending forty and four
    # gigabytes to discover that uv.lock had drifted -- or that word_error_rate,
    # which decides this job's own verdict, is broken. Not gated on `check`,
    # which would add its own twenty minutes to a job that already has the same
    # prerequisites.
    name: integration (real weights)
    if: inputs.integration
    needs: [lint, test]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # The secrets context is not available in a job-level `if:`, so the token
      # check has to be a step. Fail on it explicitly, and before the download:
      # an absent token otherwise surfaces minutes in, as a GatedRepoError from
      # load_asr.
      - name: Require an HF token
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "::error::HF_TOKEN is not set. The weights are gated: accept the terms at https://huggingface.co/CohereLabs/cohere-transcribe-03-2026, then add a read token as a repository secret named HF_TOKEN."
            exit 1
          fi

      - name: uv sync
        run: uv sync --locked

      - name: Install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install ffmpeg

      # The only copy of this probe. `check` carried one too until it was cut:
      # there it merely reordered a failure that was going to happen thirty
      # seconds later anyway, while here it comes before the ~4 GB download.
      #
      # It is not the same thing as a missing binary -- verify_transcription.py
      # already refuses to start when `say` is absent from PATH. What it catches
      # is a runner image where `say` runs and produces no usable voice, which
      # GitHub does not document either way, and which surfaces as nine decode
      # failures and three 100% word error rates that look nothing like their
      # cause.
      #
      # stat rather than `wc -c`, which pads its output on BSD: the error below
      # is the entire diagnosis, and "only     52 bytes" reads as noise.
      - name: Probe the macOS speech synthesizer
        run: |
          say -o "${RUNNER_TEMP}/probe.aiff" "probe one two three"
          bytes=$(stat -f%z "${RUNNER_TEMP}/probe.aiff")
          echo "say produced ${bytes} bytes"
          if [ "${bytes}" -lt 1000 ]; then
            echo "::error::say produced only ${bytes} bytes; this runner image has no usable voice"
            exit 1
          fi

      # huggingface_hub reads HF_TOKEN from the environment, so there is no
      # `hf auth login` step to run here.
      #
      # The Hub cache is deliberately not restored with actions/cache: the
      # checkpoint is ~4 GB against a 10 GB per-repository cache limit, so
      # caching it would evict the uv cache that every job depends on, to save a
      # download this manually-triggered job performs a handful of times a year.
      - name: verify_transcription.py
        run: uv run --locked verify_transcription.py

  release:
    # A version bump in pyproject.toml is the trigger, and the tag is cut from
    # the commit that carried it. Push only -- a pull_request run has nothing to
    # tag, workflow_dispatch is the integration job's door, and `on.push` is
    # already restricted to main, so a `github.ref` conjunct here would be a
    # condition that cannot come out false.
    #
    # Gated on all three checks rather than the lint+test pair `integration`
    # settles for. `check` is the only run of ty and of the nine-format decode
    # matrix anywhere, and a published tag is the one thing this repo produces
    # that clones pick up within seconds of it existing -- so it must not
    # outrun the job that decodes every format the uploader advertises. A
    # failed or skipped `needs` skips this job, which is the behaviour wanted:
    # no green tag on a red commit.
    name: release (tag and publish)
    needs: [lint, test, check]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level, and never the workflow block. Widening `permissions:` at the top
    # would hand contents: write to `integration`, the one job holding HF_TOKEN,
    # and to the two that run uvx-downloaded third-party tools.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The default fetch-depth: 1 arrives with no history and no tags, and
          # this job needs both -- `git describe` picks the notes base out of the
          # tag list, walking ancestry. fetch-tags is stated rather than left to
          # follow from fetch-depth: 0, because which of the two actually brings
          # tags down has moved across checkout releases and the failure is
          # silent in the worst direction: no tags reads as "first release ever"
          # and re-lists the whole history in the notes.
          fetch-depth: 0
          fetch-tags: true
          # This is the one job holding contents: write, and the argument for
          # keeping that off the workflow block is partly that checkout persists
          # credentials by default -- so it must not persist them here either.
          # Every git call below is local and `gh` authenticates from GH_TOKEN,
          # so nothing wants a credential on disk, and a step added later cannot
          # inherit push access it never asked for.
          persist-credentials: false

      # One step on purpose. Splitting the version read from the release would
      # need a step output and an `if:` on the second half to say what `exit 0`
      # says here in one line.
      #
      # Detection is state-based -- read the version, ask whether it was already
      # released -- rather than a diff of pyproject.toml against the previous
      # commit. Only one run in the push concurrency group is pending at a time,
      # and a newer push cancels and replaces it, so a bump can lose the run it
      # arrived on. The version lives in the file rather than in the commit, so
      # the surviving run reads the same bumped value and cuts the release
      # anyway. A diff against HEAD~1 would have dropped it silently.
      - name: Tag and publish on a version bump
        env:
          # gh reads GH_TOKEN. Kept in `env:` rather than expanded in the body:
          # no ${{ }} appears inside a `run:` anywhere in this workflow, which is
          # what makes every one of them injection-free by construction.
          #
          # A tag pushed by GITHUB_TOKEN starts no further workflow run. Nothing
          # here triggers on `release` or on tags, so that is the wanted
          # behaviour rather than a limitation -- but it is why a future
          # publish-on-release job would need a PAT.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # defaults.run.shell supplies -e and -o pipefail but not -u, and this
          # block is the one piece of shell in the repo that shellcheck does not
          # see. Unset is the failure mode that matters here: a misspelled
          # ${previou} would expand empty, turn the range into `..HEAD`, and
          # reshape the notes rather than raise.
          set -u

          # tomllib, not sed: `version` is a common key, and [tool.ruff] or a
          # future [tool.*] table carrying one would have a line-anchored sed
          # tagging the wrong string. This reads [project].version or fails.
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')

          # The tag-safe subset of PEP 440 rather than the whole of it: a local
          # version (1.0.0+cuda) or an epoch (1!2.0) is legal there and rejected
          # here, because neither belongs in a tag for a project that ships no
          # package. The value becomes a git ref and a gh argument, so a newline
          # in it is the rejection that matters.
          case "${version}" in
            '' | *[!0-9A-Za-z.-]*)
              echo "::error::[project] version is not a usable tag name: ${version}"
              exit 1
              ;;
          esac

          tag="v${version}"

          # Whether the version was *released*, not whether the ref exists. A
          # tag left behind by a half-finished run, or kept after a release was
          # deleted, would otherwise suppress its own release permanently --
          # green on every push, reporting "no new version" about a version that
          # was never published.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} is already released; pyproject.toml carries no new version"
            exit 0
          fi

          # git describe, not `git tag --list --sort=-v:refname | head -1`: git's
          # version sort ranks a prerelease above its own final release, so
          # v0.2.0rc1 outranks v0.2.0 and the next release would re-list every
          # commit already published in it. describe walks ancestry, which also
          # keeps a tag from an abandoned branch out of the range.
          #
          # git log rather than --generate-notes, which builds its body from
          # merged pull requests. Every commit here lands on main directly, so
          # the generated body would be a bare compare link and nothing else.
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          notes="${RUNNER_TEMP}/notes.md"
          git log --no-merges --reverse --format='- %s' ${previous:+"${previous}..HEAD"} >"${notes}"

          # --target pins the release to the commit the three jobs above passed,
          # not to wherever main has moved while this job queued.
          #
          # No --latest: GitHub already picks Latest by date and version, and
          # forcing it would let a corrective 0.1.1 landing after 0.2.0 demote
          # 0.2.0 both on the release page and at /releases/latest, which is the
          # URL a reader follows. --prerelease matches PEP 440's actual
          # prerelease spellings rather than "contains a non-digit", so a stable
          # post-release (1.0.0.post1) is not filed below the release it exists
          # to supersede.
          args=(--target "${GITHUB_SHA}" --title "${tag}" --notes-file "${notes}")
          case "${version}" in
            *a* | *b* | *rc* | *dev*) args+=(--prerelease) ;;
          esac

          gh release create "${tag}" "${args[@]}"
