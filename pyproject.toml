[project]
name = "cohere-transcribe"
version = "0.1.0"
description = "Streamlit application for transcription using Cohere Transcribe on Apple Silicon with MLX."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # 1.61, not 1.57: `icon=` on st.metric and `lazy=` on st.dataframe both land
    # there, and the metrics row and the chunk table pass them. Established by
    # resolving every `st.*` call the app makes against clean 1.57/1.58/1.59/1.60
    # installs, where those two arguments are the only casualties -- so dropping
    # one of them is not enough to lower the floor.
    # uv.lock pins 1.62.0, so a floor that undershoots is invisible to `uv sync
    # --locked` and to CI -- it only breaks whoever resolves from this file alone.
    "streamlit>=1.61",
    # 0.4.4 brought the faster long-form path and VAD pre-processing for Cohere ASR.
    #
    # `[stt]` is not decoration -- it is the only thing that names sentencepiece, which
    # `CohereAsrTokenizer.__init__` imports unconditionally. `post_load_hook` builds that
    # tokenizer as the last step of the load, *after* `load_weights(strict=True)` has
    # already passed, so a missing sentencepiece surfaces as a bare ModuleNotFoundError
    # four gigabytes in rather than at resolve time -- past the one check this app treats
    # as its integrity gate. Until mlx-audio 0.5.1 it arrived by accident, as a transitive
    # of mlx-lm; 0.5.1 vendors its own KVCache, drops mlx-lm, and takes sentencepiece with
    # it, so `mlx-audio>=0.4.4` with no extras already admits a release that cannot
    # transcribe. The extra exists as far back as 0.4.4, so this states the requirement
    # without moving the floor. Nothing in CI would catch its absence: `test` never
    # imports mlx_audio and `check` runs check_decoding, which needs no model.
    #
    # The ceiling is that same argument one level up. `_patch_vad_dtype` wraps a
    # private method, and its no-op guard covers only `_segment_with_vad` being
    # *removed*. A kept-but-changed signature walks straight past that guard, and the
    # wrapper forwards *args/**kwargs untouched, so it raises nothing: `max_chunk_s`
    # renamed or folded into a config object reaches upstream intact while the
    # wrapper's own kwargs.get("max_chunk_s", 30.0) falls back to 30 s and caps every
    # VAD chunk at a window the caller never asked for. 0.4.7 and 0.5.1 are the two
    # releases that shim has actually been checked against, so the range stops where
    # the checking does rather than where the API happens to still work.
    "mlx-audio[stt]>=0.4.4,<0.6",
    "numpy>=2.0",
]

# Dev-only tooling: `uv sync` installs it for contributors and CI while it stays
# out of the app's own dependency set.
#
# pytest runs the pure-function suite -- see tests/test_pure.py for what
# deliberately stays out of it.
#
# watchdog is what Streamlit's file watcher uses when it is importable. Without
# it `server.fileWatcherType = "auto"` degrades to polling every source file on a
# timer, which is why `streamlit run` prints its "For better performance, install
# the Watchdog module" notice. Nothing the app does at runtime imports it, so it
# has no place in [project.dependencies].
[dependency-groups]
dev = [
    "pytest>=8.4",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
# Required, not a convenience. pyproject.toml has no [build-system] on purpose, so
# the project is never installed into the venv and `utils` is imported relative to
# the repo root. pytest puts the first non-package parent of a test file on
# sys.path -- that is `tests/`, not the root -- so `from utils.audio import ...`
# raises ModuleNotFoundError without this. Preferred over adding tests/__init__.py
# because it states the reason rather than relying on a side effect of packaging.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Pinned because rule-set drift is a runtime hazard here, not a style question.
# Ruff's defaults have widened across releases, and the codebase is clean only
# under this one; see lint.extend-ignore below for the rule that must stay off.
required-version = "==0.16.1"

[tool.ruff.lint]
# E402 is absent from the default rule set, so this is a no-op today and a guard
# against the release that adds it. Imports in streamlit_app.py sit below
# st.set_page_config because it must be the first Streamlit call, and in
# verify_transcription.py below warnings.filterwarnings. Hoisting them to the top
# is what E402 asks for and it breaks both files at runtime, while lint reports
# success -- the one failure mode a linter should never be able to cause.
extend-ignore = ["E402"]
